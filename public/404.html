<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#08080a" />
    <link rel="icon" type="image/png" href="/cute-spiderman-cartoon-sticker.png" />
    <title>Page Not Found | Melwin Robinson</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        background: #08080a;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
      }

      body::before {
        position: fixed;
        inset: 0;
        content: "";
        opacity: 0.18;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.18) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.18) 1px, transparent 1px);
        background-size: 72px 72px;
      }

      main {
        position: relative;
        z-index: 1;
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        justify-content: center;
        padding: 64px clamp(24px, 6vw, 80px);
      }

      img {
        position: fixed;
        top: clamp(32px, 8vw, 72px);
        right: clamp(24px, 6vw, 72px);
        width: clamp(96px, 14vw, 176px);
        transform: rotate(12deg);
        filter: drop-shadow(0 16px 24px rgba(255, 44, 55, 0.28));
      }

      p.path {
        margin: 0 0 16px;
        color: rgba(255, 255, 255, 0.55);
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        max-width: 920px;
        font-family: Impact, "Arial Black", sans-serif;
        font-size: clamp(76px, 16vw, 190px);
        font-weight: 900;
        line-height: 0.78;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      p.copy {
        max-width: 560px;
        margin: 28px 0 0;
        color: rgba(255, 255, 255, 0.68);
        font-size: 18px;
        line-height: 1.65;
      }

      a {
        display: inline-flex;
        width: fit-content;
        margin-top: 32px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 999px;
        background: #fff;
        color: #000;
        padding: 12px 20px;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <img
      src="/cute-spiderman-cartoon-sticker.png"
      alt="Cute Spider-Man sticker marking a missing portfolio page"
      draggable="false"
    />
    <main>
      <p class="path">melwinrobinson.xyz</p>
      <h1>Page<br />Not Found</h1>
      <p class="copy">
        This part of Melwin Robinson's portfolio does not exist. Head back to the main page.
      </p>
      <a href="/">Back to home</a>
    </main>
  </body>
</html>
